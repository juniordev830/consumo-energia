name: .NET build and energy checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- --self-test
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- examples/cenario.json
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- --compare examples/cenario.json examples/cenario-economico.json
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- --budget examples/cenario.json 100.00
