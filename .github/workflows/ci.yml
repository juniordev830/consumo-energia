name: CI
on:
  push:
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build ConsumoEnergia.csproj -c Release
      - run: dotnet run --project tests/RulesCheck/RulesCheck.csproj -c Release
