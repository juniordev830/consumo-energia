name: .NET build and energy checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- --self-test
      - run: dotnet run --project src/ConsumoEnergia/ConsumoEnergia.csproj --configuration Release -- examples/cenario.json
